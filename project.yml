name: Conductor
options:
  bundleIdPrefix: org.evgenii
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
  configs:
    # A stable identity keeps the Keychain from asking again after every rebuild; ad-hoc changes with each build.
    Debug:
      CODE_SIGN_IDENTITY: Apple Development
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 7X7PA8RA37
targets:
  Conductor:
    type: application
    platform: macOS
    sources: [Conductor]
    scheme:
      testTargets: [ConductorTests]
    entitlements:
      path: Conductor/Conductor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Conductor/Info.plist
      properties:
        CFBundleDisplayName: Conductor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: org.evgenii.conductor
            CFBundleURLSchemes: [conductor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.evgenii.conductor
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ConductorTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Conductor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.evgenii.conductor.tests
        GENERATE_INFOPLIST_FILE: true
