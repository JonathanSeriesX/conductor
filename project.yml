name: Conductor
options:
  bundleIdPrefix: org.evgenii
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Every local build, Debug or Release, is signed with the team, so they all share one data protection keychain
    # item: the same signed-in accounts, and never the permission dialog that the legacy keychain's per-binary ACL
    # raises after a rebuild. CI has no certificate and overrides these on its command line (see release.yml).
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7X7PA8RA37
targets:
  Conductor:
    type: application
    platform: macOS
    sources: [Conductor]
    scheme:
      testTargets: [ConductorTests]
    info:
      path: Conductor/Info.plist
      properties:
        CFBundleDisplayName: Conductor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: org.evgenii.conductor
            CFBundleURLSchemes: [conductor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.evgenii.conductor
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Conductor.entitlements is the same minus the keychain group, for ad-hoc builds on CI.
        CODE_SIGN_ENTITLEMENTS: Conductor/Signed.entitlements
  ConductorTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Conductor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.evgenii.conductor.tests
        GENERATE_INFOPLIST_FILE: true
